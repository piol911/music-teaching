<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>我的网页</title>
<style>
:root{
  --ink:#F3F1EC; --mute:rgba(243,241,236,.62); --faint:rgba(243,241,236,.36);
  --line:rgba(243,241,236,.14); --accent:#E2231A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#0B0B0C;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:#0B0B0C url(assets/hero.jpg) center 38%/cover no-repeat;
  filter:grayscale(1) contrast(1.04);transform:scale(1.02);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(110% 80% at 15% 8%,rgba(0,0,0,.10),rgba(0,0,0,.52) 55%,rgba(0,0,0,.82) 100%),
    linear-gradient(180deg,rgba(9,9,10,.48) 0%,rgba(9,9,10,.58) 38%,rgba(9,9,10,.9) 100%);
}
.wrap{
  position:relative;max-width:1120px;margin:0 auto;min-height:100%;
  padding:clamp(20px,3.4vw,34px) clamp(20px,4.4vw,46px) 26px;
  display:flex;flex-direction:column;
}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.mark{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--ink)}
.mark i{color:var(--accent);font-style:normal}
.hd-acts{display:flex;gap:8px;align-items:center;flex:none}
.lockBtn,.edit{
  appearance:none;border:1px solid rgba(243,241,236,.22);background:rgba(255,255,255,.04);
  color:var(--mute);font:inherit;font-size:11.5px;letter-spacing:.08em;
  padding:7px 12px;border-radius:999px;cursor:pointer;
  transition:color .25s,border-color .25s,background .25s;
  text-decoration:none;
}
.hd-acts .notes-link{text-decoration:none;display:inline-flex;align-items:center;line-height:1}
.lockBtn:hover,.edit:hover{color:var(--ink);border-color:rgba(243,241,236,.45);background:rgba(255,255,255,.09)}
.edit[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}

.head{margin-top:clamp(26px,6vw,64px);max-width:52em}
.eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.36em;color:var(--mute)}
.eyebrow::before{content:'';width:28px;height:1px;background:var(--accent);display:block}
h1{margin:0 0 18px;font-size:clamp(44px,8.6vw,94px);line-height:.96;letter-spacing:-.035em;font-weight:500}
.lede{margin:0;max-width:36em;font-size:14px;line-height:1.8;color:var(--mute)}

.aside{display:flex;gap:clamp(20px,4vw,44px);margin-top:26px;flex-wrap:wrap}
.meta{display:flex;flex-direction:column;gap:5px}
.meta .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--faint)}
.meta .v{font-family:var(--mono);font-size:15px;letter-spacing:.02em;color:var(--ink)}
.meta .note{display:none}

.main{margin-top:clamp(24px,4.6vw,48px);flex:1}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{position:relative;opacity:0;animation:rise .72s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.row{
  display:grid;grid-template-columns:52px minmax(0,1fr) auto 22px;
  align-items:baseline;gap:16px;padding:20px 8px;
  text-decoration:none;color:inherit;border-bottom:1px solid var(--line);
  transition:background .3s ease,transform .3s ease,padding .3s ease;
}
.row:hover,.row:focus-visible{background:rgba(255,255,255,.055);transform:translateX(8px);outline:none}
.idx{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint)}
.name{font-size:clamp(19px,3vw,29px);letter-spacing:-.012em;line-height:1.2}
.desc{font-size:12px;color:var(--mute);text-align:right;justify-self:end;max-width:22em}
.chev{font-size:15px;color:var(--faint);transition:transform .3s ease,color .3s ease;justify-self:end}
.row:hover .chev{transform:translateX(6px);color:var(--accent)}
.staff{display:none}
.del{
  position:absolute;right:6px;top:8px;width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(226,35,26,.5);background:rgba(226,35,26,.14);color:#fff;
  font-size:14px;line-height:1;display:none;place-items:center;cursor:pointer;
}
body.editing .del{display:grid}
body.editing .list li{padding-right:6px}
.empty{
  list-style:none;padding:34px 4px;color:var(--mute);font-size:13.5px;line-height:1.9;
  border-bottom:1px solid var(--line);
}
.add,.reset{
  appearance:none;margin-top:18px;border:1px solid rgba(243,241,236,.2);
  background:none;color:var(--mute);font:inherit;font-size:12.5px;
  padding:10px 16px;border-radius:999px;cursor:pointer;margin-right:8px;
  transition:color .25s,border-color .25s,background .25s;
}
.add{display:none}
body.editing .add{display:inline-block}
.reset{display:none}
body.editing .reset{display:inline-block}
.add:hover,.reset:hover{color:var(--ink);border-color:rgba(243,241,236,.4);background:rgba(255,255,255,.06)}

footer{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);
}
footer .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}

.mask{
  position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:22px;
  background:rgba(6,6,7,.72);backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
}
.mask.on{opacity:1;visibility:visible}
.sheet{
  width:min(430px,100%);background:#141416;border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:24px;color:var(--ink);
}
.sheet h2{margin:0 0 8px;font-size:16px;font-weight:500}
.sheet .hint{margin:0 0 18px;font-size:12.5px;line-height:1.7;color:var(--mute)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:11px;letter-spacing:.14em;color:var(--faint);margin-bottom:6px;font-family:var(--mono)}
.field input{
  width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:14px;outline:none;
}
.field input:focus{border-color:rgba(226,35,26,.7)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.acts button{
  appearance:none;border:1px solid rgba(255,255,255,.18);background:none;color:var(--mute);
  font:inherit;font-size:13px;padding:9px 16px;border-radius:9px;cursor:pointer;
}
.acts .primary{background:var(--accent);border-color:var(--accent);color:#fff}

.lock{
  position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:26px;
  background:rgba(6,6,7,.9);backdrop-filter:blur(18px);
  opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;
}
.lock.on{opacity:1;visibility:visible}
.lock-hd{text-align:center}
.lock-hd .t{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--mute)}
.lock-hd .s{margin:12px 0 0;font-size:13px;color:var(--faint);min-height:1.4em}
.marks{list-style:none;display:grid;grid-template-columns:repeat(3,70px);gap:16px;margin:12px 0 0;padding:0}
.marks li{display:grid;place-items:center}
.mark-t{
  width:70px;height:70px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.03);color:rgba(243,241,236,.82);
  display:grid;place-items:center;cursor:pointer;
  transition:border-color .25s,color .25s,background .25s,transform .2s;
}
.mark-t:hover{border-color:rgba(255,255,255,.4)}
.mark-t:active{transform:scale(.94)}
.mark-t[aria-pressed="true"]{border-color:var(--accent);color:#fff;background:rgba(226,35,26,.22)}
.mark-t svg{width:26px;height:26px}
.seq{display:flex;gap:8px;min-height:8px;margin-top:4px}
.seq i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .2s}
.seq i.on{background:var(--accent)}
.lock-acts{display:flex;gap:10px;margin-top:8px}
.lock-acts button{
  appearance:none;border:1px solid rgba(255,255,255,.2);background:none;color:var(--mute);
  font:inherit;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;
}
.lock-acts button:hover{color:var(--ink);border-color:rgba(255,255,255,.45)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:#1B1B1E;border:1px solid rgba(255,255,255,.14);color:var(--ink);
  font-size:12.5px;padding:10px 16px;border-radius:999px;z-index:300;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
  body::before{background-image:url(assets/hero-sm.jpg)}
  .row{grid-template-columns:34px minmax(0,1fr) 18px;gap:10px;padding:16px 4px}
  .desc{display:none}
  .chev{grid-column:3}
  .head{margin-top:34px}
  h1{letter-spacing:-.03em}
  .aside{gap:22px}
  .marks{grid-template-columns:repeat(3,64px);gap:12px}
  .mark-t{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .list li{opacity:1}
}
</style>
</head>
<body>


<div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-hd">
    <div class="t" id="lockTitle">我的网页</div>
    <p class="s" id="lockMsg">按顺序点击符号</p>
  </div>
  <ul class="marks" id="marks"></ul>
  <div class="seq" id="seq" aria-hidden="true"></div>
  <div class="lock-acts" id="lockActs"></div>
</div>

<div class="wrap">
  <header class="masthead">
    <span class="mark">XY<i>.</i>6300</span>
    <span class="hd-acts">
      <a class="lockBtn notes-link" href="notes/?v=20261109a">笔记</a>
      <button class="lockBtn" id="lockMgr">图案密码</button>
      <button class="edit" id="editBtn" aria-pressed="false">编辑</button>
    </span>
  </header>

  <div class="head">
    <p class="eyebrow">私人索引</p>
    <h1>我的网页</h1>
    <p class="lede">这里放着我做的几个页面。列表存在云端——手机上加的，电脑上也能打开。</p>
  </div>

  <aside class="aside">
    <div class="meta"><span class="k">入口</span><span class="v" id="count">0</span></div>
    <div class="meta"><span class="k">此刻</span><span class="v" id="clock">--:--</span></div>
    <div class="meta"><span class="k">状态</span><span class="v" id="state">—</span></div>
  </aside>

  <nav class="main">
    <ol class="list" id="list"></ol>
    <button class="add" id="addBtn">＋　添加一项</button>
    <button class="reset" id="remoteBtn">遥控画布</button>
    <button class="reset" id="resetBtn">清空列表</button>
  </nav>

  <footer>
    <span>共 <span id="countFoot">0</span> 个入口</span>
    <span class="dot"></span>
    <span id="clockFoot">--:--</span>
    <span class="dot"></span>
    <span id="stateFoot">—</span>
  </footer>
</div>

<div class="mask" id="maskAdd">
  <div class="sheet">
    <h2>添加一项</h2>
    <p class="hint">地址可以填站内相对路径（如 <code>canvas/</code>），也可以填完整网址。</p>
    <label class="field"><span>名称</span><input id="fName" placeholder="我的新页面" autocomplete="off"></label>
    <label class="field"><span>地址</span><input id="fHref" placeholder="canvas/ 或 https://…" autocomplete="off" inputmode="url"></label>
    <label class="field"><span>说明（可留空）</span><input id="fDesc" placeholder="一句话" autocomplete="off"></label>
    <div class="acts">
      <button id="addCancel">取消</button>
      <button class="primary" id="addSave">保存</button>
    </div>
  </div>
</div>

<div class="mask" id="maskReset">
  <div class="sheet">
    <h2>忘记顺序了</h2>
    <p class="hint">填<b>空间码</b>验证一下，对得上就清除图案密码，之后可以重新设置。<br>
      空间码已经内置在页面里，解锁后点「改图案」就能看到它。</p>
    <label class="field"><span>空间码</span><input id="fUnlock" placeholder="当初填的那个" autocomplete="off"></label>
    <div class="acts">
      <button id="resetCancel">取消</button>
      <button class="primary" id="resetOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* ============================================================
   链接列表
   2026-09-21 起：列表**不再写在源码里**（否则别人不用解锁、直接看网页源码就能读到）。
   现在的顺序是：本机快照（离线也能看）→ 解锁后从云端拉取（同一空间码多设备同步）
   ============================================================ */
const CLOUD_API = 'https://art-d9giyyspp3921f818-1312774719.ap-shanghai.app.tcloudbase.com/sync';
const TRUST_LS = 'canvas.trust';      // 与画布共用：解锁一次，两边都免登录
const CODE_LS = 'xy6300.portal.code';
const LINKS_LS = 'xy6300.portal.links';

/* 2026-09-21 起不再让你填空间码：钥匙写在页面里，打开就用。
   和画布一样的思路——私人工具不该把「记不记得住」当成数据安全的前提。
   空间码现在只剩一个用途：忘记图案顺序时用来清除密码。 */
const PORTAL_KEY = '5XpKkMNG7Th3AKpdDzyRRbybHd3e';

const DEFAULTS = [];   // 故意留空：入口不出现在任何人都能读到的源码里

let links = DEFAULTS.slice();
const code = PORTAL_KEY;
let editing = false;

/* 本机快照：没网的时候也能看到上次同步过的列表 */
function saveLocal() {
  try { localStorage.setItem(LINKS_LS, JSON.stringify(links)); } catch (e) { /* 忽略 */ }
}
try {
  const raw = localStorage.getItem(LINKS_LS);
  if (raw) { const a = JSON.parse(raw); if (Array.isArray(a)) links = a; }
} catch (e) { /* 忽略 */ }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const two = n => String(n + 1).padStart(2, '0');

/* ---------------- 渲染 ---------------- */
function render() {
  const list = $('#list');
  if (!links.length) {
    list.innerHTML = '<li class="empty">这里是空的。点右上角「编辑」→「添加一项」。<br>如果别的设备已经加过，稍等几秒会自动同步过来。</li>';
  } else {
    list.innerHTML = links.map((it, i) => {
      const d = Math.min(i, 12) * 70 + 140;
      return `
      <li style="--d:${d}ms">
        <a class="row" href="${esc(it.href)}" style="--d:${d}ms">
          <span class="idx">${two(i)}</span>
          <span class="name">${esc(it.name)}</span>
          ${it.desc ? `<span class="desc">${esc(it.desc)}</span>` : '<span class="desc"></span>'}
          <span class="chev" aria-hidden="true">&#8594;</span>
        </a>
        <button class="del" data-i="${i}" title="删除" aria-label="删除">&#215;</button>
        <span class="staff" aria-hidden="true"></span>
      </li>`;
    }).join('');
  }
  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', ev => { ev.preventDefault(); removeAt(+btn.dataset.i); });
  });
  const label = code ? (editing ? '编辑中' : '已同步') : '本地';
  $('#state').textContent = label;
  $('#stateFoot').textContent = label;
  $('#count').textContent = links.length;
  $('#countFoot').textContent = links.length;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------------- 云端读写 ---------------- */
const recKey = () => code + '--portal';      // 和画布的数据分开存，互不覆盖

/* ------------------------------------------------------------------
   多端合并：以前整份覆盖，两台设备各改一点就会互相抹掉。
   现在按「地址」为键逐条合并，带时间戳的新的赢；删除靠墓碑同步。
   ------------------------------------------------------------------ */
const TOMB_LS = 'xy6300.portal.linkstomb';
let linkTomb = [], lastPullAt = 0;
function saveTomb() { try { localStorage.setItem(TOMB_LS, JSON.stringify(linkTomb)); } catch (e) { /* 忽略 */ } }
try { const _t = JSON.parse(localStorage.getItem(TOMB_LS) || '[]'); if (Array.isArray(_t)) linkTomb = _t; } catch (e) { /* 忽略 */ }

const linkMt = it => (it && it.mt) || 0;
function tombAtL(tomb, href) {
  let m = 0;
  (tomb || []).forEach(t => { if (t && t.href === href && t.t > m) m = t.t; });
  return m;
}
function mergeLinks(localLinks, localTomb, cloudLinks, cloudTomb) {
  const tombMap = new Map();
  [].concat(localTomb || [], cloudTomb || []).forEach(t => {
    if (!t || !t.href) return;
    const cur = tombMap.get(t.href);
    if (!cur || (t.t || 0) > (cur.t || 0)) tombMap.set(t.href, t);
  });
  const order = [], map = new Map();
  (localLinks || []).forEach(it => { if (it && it.href) { map.set(it.href, it); order.push(it.href); } });
  (cloudLinks || []).forEach(it => {
    if (!it || !it.href) return;
    const cur = map.get(it.href);
    if (!cur) { if (tombAtL([...tombMap.values()], it.href) <= linkMt(it)) { map.set(it.href, it); order.push(it.href); } }
    else if (linkMt(it) > linkMt(cur)) map.set(it.href, it);
  });
  const out = [];
  order.forEach(h => {
    const it = map.get(h);
    if (it && tombAtL([...tombMap.values()], h) <= linkMt(it)) out.push(it);
  });
  return { links: out, tomb: [...tombMap.values()] };
}

async function pull() {
  if (!code) return;
  try {
    const r = await fetch(CLOUD_API + '?key=' + encodeURIComponent(recKey()), { cache: 'no-store' });
    const j = await r.json();
    lastPullAt = Date.now();
    if (j && j.data && Array.isArray(j.data.links)) {
      /* 自愈：云端被清空了、本机还有 → 把本机这份补回去。
         （之前首页在新设备上空白，就是云端 links 被写成 0 条导致的） */
      if (!j.data.links.length && links.length) { push(); }
      // 合并而不是覆盖：本机加的和别处加的都要留着
      const m = mergeLinks(links, linkTomb, j.data.links, j.data.tomb);
      if (JSON.stringify(m.links.map(x => x.href)) !== JSON.stringify(links.map(x => x.href))) {
        links = m.links; linkTomb = m.tomb; saveTomb(); saveLocal(); render();
      } else if (JSON.stringify(m.tomb) !== JSON.stringify(linkTomb)) {
        linkTomb = m.tomb; saveTomb();
      } else { saveLocal(); }
    }
    if (j && j.data && ('lock' in j.data)) {   // 明确写了 null 才算「取消密码」
      lockCfg = j.data.lock || null;
      saveLockLocal();
      syncLockBtn();
    }
  } catch (e) { /* 离线时就用默认/本地这份，不打扰 */ }
}

/* 带重试的拉取：网络抖动时不至于白屏。每次打开页面都会走这里 */
async function pullRetry(n = 3) {
  for (let i = 0; i < n; i++) {
    await pull();
    if (links.length) return true;
    await new Promise(r => setTimeout(r, 600 * (i + 1)));
  }
  return false;
}

async function push(force) {
  if (!code) return false;
  try {
    /* 一律「先读云端 → 合并 → 再写」。
       原来有个「刚拉过 5 秒就直接写」的捷径：一旦某台设备还没拉到数据
       （或者拉取失败），它就会把**空列表**整份盖上去 —— 首页就是这么被清空的。
       force=true 只给「用户主动保存」用（允许把最后一条也删掉）。 */
    let toWrite = { v: 1, links, tomb: linkTomb, lock: lockCfg };
    try {
      const cur = await fetch(CLOUD_API + '?key=' + encodeURIComponent(recKey()), { cache: 'no-store' });
      const cj = await cur.json();
      if (cj && cj.data && Array.isArray(cj.data.links)) {
        // 本机空、云端有内容、又不是用户主动保存 → 拒绝推空，别清空别人的数据
        if (!force && !links.length && cj.data.links.length) return false;
        const m = mergeLinks(links, linkTomb, cj.data.links, cj.data.tomb);
        toWrite = { v: 1, links: m.links, tomb: m.tomb, lock: lockCfg };
        if (JSON.stringify(m.links.map(x => x.href)) !== JSON.stringify(links.map(x => x.href))) {
          links = m.links; linkTomb = m.tomb; saveTomb(); saveLocal(); render();
        }
      }
    } catch (e) { /* 读不到就照原样写 */ }
    const r = await fetch(CLOUD_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: recKey(), data: toWrite })
    });
    const j = await r.json();
    return !!(j && j.ok);
  } catch (e) { return false; }
}

async function save(msg) {
  const ok = await push(true);      // 用户主动保存：允许把最后一条也删掉
  const label = editing ? '编辑中' : '已同步';
  $('#state').textContent = label;
  $('#stateFoot').textContent = label;
  toast(ok ? (msg || '已保存') : '保存失败，检查网络后重试');
}

/* ---------------- 增删 ---------------- */
function removeAt(i) {
  const it = links[i];
  if (!it) return;
  links.splice(i, 1);
  // 记墓碑：否则别的设备不知道这条被删了，一合并又把它加回来
  linkTomb = (linkTomb || []).filter(t => t.href !== it.href);
  linkTomb.push({ href: it.href, t: Date.now() });
  saveTomb();
  render();
  save('已删除「' + it.name + '」');
}

/* ---------------- 弹层 ---------------- */
function openMask(id) { $(id).classList.add('on'); }
function closeMask(id) { $(id).classList.remove('on'); }

$('#editBtn').addEventListener('click', () => {
  if (editing) {
    editing = false;
    document.body.classList.remove('editing');
    $('#editBtn').textContent = '编辑';
    $('#editBtn').setAttribute('aria-pressed', 'false');
    $('#state').textContent = '已同步';
    $('#stateFoot').textContent = '已同步';
    return;
  }
  editing = true;
  document.body.classList.add('editing');
  $('#editBtn').textContent = '完成';
  $('#editBtn').setAttribute('aria-pressed', 'true');
  $('#state').textContent = '编辑中';
  $('#stateFoot').textContent = '编辑中';
});

$('#addBtn').addEventListener('click', () => {
  $('#fName').value = ''; $('#fHref').value = ''; $('#fDesc').value = '';
  openMask('#maskAdd');
  setTimeout(() => $('#fName').focus(), 400);
});
$('#addCancel').addEventListener('click', () => closeMask('#maskAdd'));
$('#addSave').addEventListener('click', () => {
  const name = $('#fName').value.trim();
  let href = $('#fHref').value.trim();
  const desc = $('#fDesc').value.trim();
  if (!name) { toast('给个名称吧'); return; }
  if (!href) { toast('还没填地址'); return; }
  // 看起来不是网址也不是相对路径的话，补上 https://
  if (!/^(https?:|\/|\.)/.test(href) && !href.includes('/')) href = 'https://' + href + '/';
  links.push({ name, href, desc, mt: Date.now() });
  linkTomb = (linkTomb || []).filter(t => t.href !== href);   // 重新加回来就撤掉墓碑
  saveTomb();
  saveLocal();
  closeMask('#maskAdd');
  render();
  save('已添加「' + name + '」');
});

/* 编辑态里直达遥控器：省得单独记一个网址 */
$('#remoteBtn').addEventListener('click', () => {
  const url = location.origin + '/canvas/?remote=1';
  try { navigator.clipboard && navigator.clipboard.writeText(url); } catch (e) { /* 忽略 */ }
  toast('遥控地址已复制，正在打开…');
  setTimeout(() => { location.href = url; }, 500);
});

$('#resetBtn').addEventListener('click', () => {
  if (!links.length) { toast('已经是空的了'); return; }
  if (!confirm('清掉全部 ' + links.length + ' 项？云端也会一起清掉，建议先记下来。')) return;
  links.forEach(it => { linkTomb = (linkTomb || []).filter(t => t.href !== it.href); linkTomb.push({ href: it.href, t: Date.now() }); });
  saveTomb();
  links = [];
  saveLocal();
  render();
  save('已清空');
});

document.querySelectorAll('.mask').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('on'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.mask.on').forEach(m => m.classList.remove('on'));
});

/* ============================================================
   图形密码：按顺序点击符号解锁
   ⚠️ 这是「帘子」不是「保险柜」——验证逻辑在网页里，源文件谁都能看。
      它解决的是「手机递给别人时不至于一眼看光」，不是真正的加密。
   ============================================================ */
const LOCK_LS = 'xy6300.portal.lock';
const UNLOCK_SS = 'xy6300.portal.unlocked';

const MARKS = [
  '<circle cx="8.5" cy="16.5" r="3.2"/><path d="M11.7 16.5V6.5l7-2.6v9"/><path d="M18.7 12.9c-1.4.6-2.8.5-4-.4"/>',
  '<circle cx="12" cy="12" r="7.5"/>',
  '<path d="M12 5l7 13H5z"/>',
  '<rect x="5.5" y="5.5" width="13" height="13"/>',
  '<path d="M3 12c2.2-3.4 4.4-3.4 6.6 0s4.4 3.4 6.6 0 4.4-3.4 4.8-2.6"/>',
  '<path d="M12 3.5c1.2 5.2 1.2 8.8 0 17-1.2-8.2-1.2-11.8 0-17z"/><path d="M3.5 12c5.2-1.2 8.8-1.2 17 0-8.2 1.2-11.8 1.2-17 0z"/>',
  '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/>',
  '<path d="M6 6l12 12M18 6L6 18"/>',
  '<path d="M15.8 4.2a8.2 8.2 0 1 0 0 15.6 10 10 0 0 1 0-15.6z"/>',
  '<path d="M12 3.5s6 6.6 6 10.5a6 6 0 0 1-12 0C6 10.1 12 3.5 12 3.5z"/>',
  '<path d="M4.5 19.5C4.5 11 11 6 19.5 6c0 8.5-6.5 13.5-15 13.5z"/><path d="M4.5 19.5C9 15 13.5 12 19.5 10.4"/>',
  '<path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>'
];

let lockCfg = null;      // { h, len, salt }，null = 没设密码
let chain = [];          // 当前点下的顺序
let stage = 'check';     // check | manage | new | confirm
let firstSeq = null;     // 设置时第一次点的顺序

try { const raw = localStorage.getItem(LOCK_LS); if (raw) lockCfg = JSON.parse(raw); } catch (e) { /* 忽略 */ }

/* ------------------------------------------------------------------
   出厂就带一组密码：音符 → 月牙 → 波浪（下标 0 → 8 → 4）
   只在从未装过密码的设备上装一次。
   ⚠️ 这组合写在源码里，所以它只是一层「帘子」：挡得住顺手点开的人，
      挡不住愿意翻源码的人。想真正保密就得改成只有你自己知道的顺序。
   改法：解锁后点右上角「改图案」重设；重设后云端也一起更新。
   ------------------------------------------------------------------ */
const PRESET_DONE = 'xy6300.portal.lockinit';
const PRESET_SEQ  = [0, 8, 4];
const PRESET_SALT = 'xy6300-factory-2026';
let presetJustInstalled = false;

(function installPreset() {
  try {
    const done = localStorage.getItem(PRESET_DONE);
    if (done || lockCfg) { localStorage.setItem(PRESET_DONE, '1'); return; }
    lockCfg = { h: digest(PRESET_SEQ, PRESET_SALT), len: PRESET_SEQ.length, salt: PRESET_SALT };
    saveLockLocal();
    localStorage.setItem(PRESET_DONE, '1');
    presetJustInstalled = true;
  } catch (e) { /* 忽略 */ }
})();

/* 顺序 → 摘要。用纯 JS 实现而不用 crypto.subtle：后者要求 https，http 下会取不到 */
function digest(seq, salt) {
  const s = seq.join(',') + '|' + salt;
  let a = 0x811c9dc5, b = 0x5f3a1c07;
  for (let i = 0; i < s.length; i++) {
    a = Math.imul(a ^ s.charCodeAt(i), 0x01000193) >>> 0;
    b = (Math.imul(b, 0x21) + s.charCodeAt(i) * (i + 7)) >>> 0;
  }
  return a.toString(36) + '-' + b.toString(36);
}
const saltOf = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function saveLockLocal() {
  try {
    if (lockCfg) localStorage.setItem(LOCK_LS, JSON.stringify(lockCfg));
    else localStorage.removeItem(LOCK_LS);
  } catch (e) { /* 忽略 */ }
}

const lockEl = $('#lock');
const svg = inner => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;

function buildMarks() {
  $('#marks').innerHTML = MARKS.map((m, i) =>
    `<li><button class="mark-t" data-i="${i}" aria-pressed="false" aria-label="符号 ${i + 1}">${svg(m)}</button></li>`
  ).join('');
}

function drawSeq() {
  const n = stage === 'check' ? Math.max(chain.length, 3) : Math.max(chain.length, 3);
  $('#seq').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < chain.length ? 'on' : ''}"></i>`).join('');
}

function setMsg(t, warn) {
  const m = $('#lockMsg');
  m.textContent = t;
  m.className = 's' + (warn ? ' warn' : '');
}

function drawBtns() {
  const a = $('#lockActs');
  const dis = chain.length < 3 ? ' disabled' : '';
  if (stage === 'check')      a.innerHTML = '<button data-act="clear">清除重来</button><button data-act="forgot">忘记顺序</button>';
  else if (stage === 'manage') a.innerHTML = '<button data-act="chg">换个顺序</button><button data-act="off">取消密码</button><button data-act="close">关闭</button>';
  else if (stage === 'new')    a.innerHTML = `<button data-act="newok"${dis}>下一步</button><button data-act="close">取消</button>`;
  else if (stage === 'confirm')a.innerHTML = '<button data-act="close">取消</button>';
}

function refresh() {
  drawSeq(); drawBtns();
  document.querySelectorAll('.mark-t').forEach(b => {
    const k = chain.indexOf(+b.dataset.i);
    b.setAttribute('aria-pressed', k >= 0 ? 'true' : 'false');
    let o = b.querySelector('.ord');
    if (k >= 0) {
      if (!o) b.insertAdjacentHTML('beforeend', '<span class="ord"></span>'), o = b.querySelector('.ord');
      o.textContent = k + 1;
    } else if (o) o.remove();
  });
}

function openLock(s, msg) {
  stage = s; chain = []; firstSeq = null;
  lockEl.classList.add('on');
  document.body.style.overflow = 'hidden';
  $('#lockTitle').textContent = s === 'check' ? '我的网页' : '图案密码';
  setMsg(msg);
  refresh();
}
function closeLock() {
  lockEl.classList.remove('on');
  document.body.style.overflow = '';
  chain = []; firstSeq = null;
  try { sessionStorage.setItem(UNLOCK_SS, '1'); } catch (e) { /* 忽略 */ }
  try { localStorage.setItem(TRUST_LS, String(Date.now() + 30 * 864e5)); } catch (e) { /* 忽略 */ }
  startSync();          // 解锁后才去取列表（锁着的时候不发任何请求）
}

function fail(msg) {
  setMsg(msg || '顺序不对，再试一次', true);
  lockEl.classList.add('shake');
  setTimeout(() => lockEl.classList.remove('shake'), 460);
  setTimeout(() => {
    if (stage === 'check') { chain = []; setMsg('按顺序点击符号解锁'); refresh(); }
  }, 620);
}

function tap(i) {
  if (stage === 'manage') return;
  if (chain.includes(i)) { chain = chain.filter(x => x !== i); refresh(); return; }
  chain.push(i);
  refresh();

  if (stage === 'check') {
    if (lockCfg && digest(chain, lockCfg.salt) === lockCfg.h) {
      setMsg('好');
      setTimeout(closeLock, 280);
    } else if (lockCfg && chain.length >= lockCfg.len) {
      fail();
    }
  } else if (stage === 'confirm') {
    if (chain.length >= firstSeq.length) {
      if (chain.join(',') === firstSeq.join(',')) commit();
      else fail('两次不一样，重新来');
    }
  }
}

function commit() {
  const salt = saltOf();
  lockCfg = { h: digest(chain, salt), len: chain.length, salt };
  presetJustInstalled = false;
  saveLockLocal();
  syncLockBtn();
  setMsg('正在保存…');
  push().then(ok => {
    if (!code) { closeLock(); toast('已设置，仅这台设备有效（填了空间码才会同步）'); return; }
    closeLock();
    toast(ok ? '图案密码已更新' : '本机已保存，云端没写到，检查网络');
  });
}

function clearLock(cb) {
  lockCfg = null;
  presetJustInstalled = false;
  saveLockLocal();
  syncLockBtn();
  push().then(() => { if (cb) cb(); });
}

$('#marks').addEventListener('click', e => {
  const b = e.target.closest('.mark-t');
  if (b) tap(+b.dataset.i);
});

$('#lockActs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'clear')  { chain = []; setMsg('按顺序点击符号解锁'); refresh(); }
  if (act === 'forgot') { $('#fUnlock').value = ''; openMask('#maskReset'); setTimeout(() => $('#fUnlock').focus(), 400); }
  if (act === 'close')  { closeLock(); }
  if (act === 'chg')    { openLock('new', '点 3～8 个符号，记住顺序'); }
  if (act === 'newok' && chain.length >= 3) {
    firstSeq = chain.slice();
    stage = 'confirm'; chain = [];
    setMsg('再点一次同样的顺序');
    refresh();
  }
  if (act === 'off') {
    clearLock(() => { closeLock(); toast('图案密码已取消'); });
  }
});

$('#resetOk').addEventListener('click', () => {
  const v = $('#fUnlock').value.trim();
  if (!code) { toast('这台设备没填过空间码，找回不了'); return; }
  if (v !== code) { toast('空间码不对'); return; }
  closeMask('#maskReset');
  clearLock(() => { closeLock(); toast('已清除，可以重新设置'); });
});
$('#resetCancel').addEventListener('click', () => closeMask('#maskReset'));

$('#lockMgr').addEventListener('click', () => {
  openLock(lockCfg ? 'manage' : 'new',
           lockCfg ? '已开启。可以换顺序或取消。\n找回用的空间码：' + code
                   : '点 3～8 个符号，记住顺序');
});

/* ---------------- 时钟 ---------------- */
function tick() {
  const d = new Date();
  const t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('#clock').textContent = t;
  $('#clockFoot').textContent = t;
}
tick();
setInterval(tick, 20000);

/* ---------------- 启动 ---------------- */
function syncLockBtn() {
  const b = $('#lockMgr');
  b.textContent = lockCfg ? '改图案' : '设密码';
  b.setAttribute('aria-pressed', lockCfg ? 'true' : 'false');
}
buildMarks();
render();
syncLockBtn();

/* 同步时机：解锁后立刻拉一次（带重试）；切回前台再拉；页面开着每 90 秒拉一次 */
let syncStarted = false;
function startSync() {
  if (!code) return;
  syncStarted = true;
  pullRetry().then(() => { if (presetJustInstalled) push(); });
}
(function bootLock() {
  let unlocked = false, trusted = false;
  try { unlocked = sessionStorage.getItem(UNLOCK_SS) === '1'; } catch (e) { /* 忽略 */ }
  try { trusted = (+localStorage.getItem(TRUST_LS) || 0) > Date.now(); } catch (e) { /* 忽略 */ }
  if (lockCfg && !unlocked && !trusted) openLock('check', '按顺序点击符号解锁');   // 锁着就先不同步
  else startSync();
})();
document.addEventListener('visibilitychange', () => { if (!document.hidden) startSync(); });
window.addEventListener('focus', () => { if (!document.hidden) startSync(); });
/* 页面开着时每 8 秒拉一次（只在可见时），切回前台/切回窗口各补一次 */
setInterval(() => { if (!document.hidden && code) pull(); }, 8000);

</script>
</body>
</html>
