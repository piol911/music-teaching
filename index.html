<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>音乐教学演示台</title>
    <link rel="stylesheet" href="style.css?v=29">
</head>
<body>

<!-- ============ 主界面 ============ -->
<div id="dashboard-screen" class="screen">
    <header class="dashboard-header">
        <div class="header-brand">
            <svg class="header-logo" viewBox="0 0 32 32" width="28" height="28">
                <path d="M10 24 V8 L24 5 V20" stroke="var(--gold)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="10" cy="24" r="3" fill="var(--gold)"/>
                <circle cx="24" cy="20" r="3" fill="var(--gold)"/>
            </svg>
            <span class="header-title">音乐教学演示台</span>
        </div>
    </header>
    <main class="dashboard-main">
        <div class="dashboard-hero">
            <h2>课程单元</h2>
            <p>悬停查看单元 · 点击开始演示</p>
        </div>
        <div id="units-grid" class="units-grid"></div>
        <div class="stack-caption" id="stack-caption"></div>
        <div id="dashboard-empty" class="empty-state" style="display:none;">
            <p>还没有内容，点击「管理内容」添加吧</p>
        </div>
    </main>
    <div class="screen-footer">
        <button id="btn-logout" class="btn btn-ghost">退出</button>
        <button id="btn-admin" class="btn btn-glass">管理内容</button>
    </div>
</div>

<!-- ============ 演示模式 ============ -->
<div id="presentation-screen" class="screen">
    <div class="presentation-vignette"></div>
    <div class="presentation-topbar" id="pres-topbar">
        <div class="pres-topbar-center">
            <span id="presentation-title" class="pres-title"></span>
            <span id="presentation-progress" class="pres-progress"></span>
        </div>
    </div>
    <div class="presentation-stage" id="presentation-stage">
        <div id="presentation-content" class="pres-content"></div>
    </div>
    <div class="presentation-thumb-bar" id="presentation-thumb-bar"></div>
    <div class="presentation-bottombar" id="pres-bottombar">
        <div class="nav-dots" id="nav-dots"></div>
        <div class="pres-dots-cluster">
            <button id="btn-toc" class="dot-btn" title="目录">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7 H20 M4 12 H20 M4 17 H20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-admin-pres" class="dot-btn" title="管理">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5 L19 19 L5 19 Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-fullscreen" class="dot-btn" title="全屏（F）">
                <svg class="fs-icon-enter" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="fs-icon-exit" viewBox="0 0 24 24" width="20" height="20" style="display:none"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-exit-presentation" class="dot-btn" title="退出（Esc）">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 6 L9 12 L15 18 M9 12 H20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>

    <!-- 目录浮层 -->
    <div id="toc-overlay" class="toc-overlay">
        <div class="toc-panel">
            <div class="toc-header">
                <span class="toc-title">目录</span>
                <button class="toc-close" id="toc-close"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
            <div class="toc-list" id="toc-list"></div>
        </div>
    </div>
</div>

<!-- ============ 管理面板 ============ -->
<div id="admin-screen" class="screen">
    <header class="admin-header">
        <div class="header-brand">
            <span class="header-title">内容管理</span>
        </div>
    </header>
    <main class="admin-main">
        <div id="admin-units-list" class="admin-units-list"></div>
    </main>
    <div class="screen-footer">
        <button id="btn-back-dashboard" class="btn btn-ghost btn-small"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6 L9 12 L15 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> 返回</button>
        <div class="footer-actions">
            <button id="btn-files" class="btn btn-glass">文件管理</button>
            <button id="btn-password" class="btn btn-glass">修改密码</button>
            <button id="btn-add-unit" class="btn btn-gold">新建单元</button>
        </div>
    </div>
</div>

<!-- ============ 文件管理页面 ============ -->
<div id="file-manager-screen" class="screen">
    <header class="admin-header">
        <div class="header-brand">
            <span class="header-title">文件管理</span>
        </div>
    </header>
    <main class="admin-main">
        <div class="storage-overview" id="storage-overview">
            <div class="storage-card">
                <div class="storage-card-label">已用空间</div>
                <div class="storage-card-value" id="storage-used">计算中...</div>
            </div>
            <div class="storage-card">
                <div class="storage-card-label">总容量</div>
                <div class="storage-card-value" id="storage-total">1 GB</div>
            </div>
            <div class="storage-card">
                <div class="storage-card-label">剩余可用</div>
                <div class="storage-card-value" id="storage-remaining">计算中...</div>
            </div>
            <div class="storage-card">
                <div class="storage-card-label">文件数量</div>
                <div class="storage-card-value" id="storage-count">计算中...</div>
            </div>
        </div>
        <div class="storage-bar-container">
            <div class="storage-bar-track">
                <div class="storage-bar-fill" id="storage-bar-fill" style="width:0%"></div>
            </div>
            <div class="storage-bar-text" id="storage-bar-text">0%</div>
        </div>
        <div id="file-list-container" class="file-list-container"></div>
    </main>
    <div class="screen-footer">
        <button id="btn-back-admin" class="btn btn-ghost btn-small"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6 L9 12 L15 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> 返回</button>
    </div>
</div>

<!-- ============ 弹窗 ============ -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modal-title">添加内容</h2>
            <button class="modal-close" id="modal-close"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<!-- ============ 沉浸式大图查看 ============ -->
<div id="immersive-viewer" class="immersive-overlay" role="dialog" aria-modal="true" aria-label="大图浏览">
    <div class="iv-stage" id="iv-stage">
        <img id="iv-img" src="" alt="" draggable="false" />
        <div class="iv-loading" id="iv-loading"><div class="iv-spinner"></div></div>
        <div class="iv-error" id="iv-error">图片加载失败</div>
    </div>
    <div class="iv-chrome" id="iv-chrome">
        <div class="iv-dots" id="iv-dots"></div>
        <div class="iv-cluster">
            <button class="iv-dot-btn" id="iv-fs" title="全屏（F）"></button>
            <button class="iv-dot-btn" id="iv-close" title="关闭（Esc）"></button>
        </div>
    </div>
</div>

<!-- ============ 视频弹窗播放器 ============ -->
<div id="video-modal-overlay" class="video-modal-overlay">
    <div class="video-modal-box">
        <div id="video-modal-content"></div>
    </div>
    <button class="video-modal-close" onclick="closeVideoModal()" aria-label="关闭"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<!-- ============ 文件预览 ============ -->
<div id="file-preview-overlay" class="file-preview-overlay" onclick="if(event.target===this)closeFilePreview()">
    <div class="file-preview-box">
        <div class="file-preview-header">
            <h2 id="file-preview-title">文件预览</h2>
            <button class="file-preview-close" onclick="closeFilePreview()"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
        <div class="file-preview-body" id="file-preview-media"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="app.js?v=24"></script>
</body>
</html>
