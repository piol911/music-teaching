<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>xy6300 · 我的网页</title>
<!--
  ============================================================
  这是 www.xy6300.cc 的门户页。
  加新网页只需要改下面 <script> 里的 SITES 数组，别的都不用动。
  ============================================================
-->
<style>
  :root {
    --bg: #f5f6f8;
    --bg-glow-1: rgba(120, 160, 255, .16);
    --bg-glow-2: rgba(255, 190, 140, .14);
    --card: #ffffff;
    --card-hover: #ffffff;
    --text: #1c1c1e;
    --text-2: #6b6b73;
    --text-3: #9a9aa3;
    --line: rgba(0, 0, 0, .07);
    --line-strong: rgba(0, 0, 0, .12);
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -12px rgba(16, 24, 40, .14);
    --shadow-hover: 0 2px 4px rgba(16, 24, 40, .05), 0 18px 40px -16px rgba(16, 24, 40, .22);
    --r: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --bg-glow-1: rgba(80, 120, 220, .20);
      --bg-glow-2: rgba(200, 130, 80, .14);
      --card: #202126;
      --card-hover: #24252b;
      --text: #f2f2f5;
      --text-2: #a0a0aa;
      --text-3: #74747e;
      --line: rgba(255, 255, 255, .08);
      --line-strong: rgba(255, 255, 255, .14);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 18px 40px -16px rgba(0, 0, 0, .7);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
                 "Helvetica Neue", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  /* 背景两团柔光，纯装饰 */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  body::before { width: 520px; height: 520px; left: -180px; top: -200px; background: var(--bg-glow-1); }
  body::after  { width: 460px; height: 460px; right: -160px; top: 30vh;  background: var(--bg-glow-2); }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 940px;
    margin: 0 auto;
    padding: 0 20px calc(48px + env(safe-area-inset-bottom));
  }

  /* ---------- 头部 ---------- */
  header { padding: 56px 0 30px; }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    color: var(--text-3);
    text-transform: uppercase;
  }
  .brand .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: linear-gradient(135deg, #5b8cff, #a97bff);
    box-shadow: 0 0 0 3px rgba(91, 140, 255, .16);
  }
  h1 {
    margin: 14px 0 8px;
    font-size: clamp(26px, 6vw, 38px);
    line-height: 1.2;
    letter-spacing: -.02em;
    font-weight: 700;
  }
  .sub { margin: 0; color: var(--text-2); font-size: 15px; line-height: 1.6; }

  /* ---------- 卡片网格 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 14px;
    margin-top: 30px;
  }
  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; gap: 12px; margin-top: 24px; }
    header { padding: 40px 0 22px; }
  }

  .card {
    position: relative;
    display: block;
    padding: 18px;
    border-radius: var(--r);
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: transform .28s cubic-bezier(.22,1,.36,1),
                box-shadow .28s cubic-bezier(.22,1,.36,1),
                border-color .2s, background .2s;
    animation: in .5s cubic-bezier(.22,1,.36,1) both;
    animation-delay: var(--d, 0ms);
  }
  @keyframes in {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  @media (hover: hover) {
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: var(--line-strong);
      background: var(--card-hover);
    }
    .card:hover .go { opacity: 1; transform: none; }
    .card:hover .icon { transform: scale(1.06) rotate(-3deg); }
  }
  .card:active { transform: scale(.985); }

  .top { display: flex; align-items: center; gap: 13px; }
  .icon {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 13px;
    display: grid; place-items: center;
    color: #fff;
    background: linear-gradient(140deg, var(--a1), var(--a2));
    box-shadow: 0 6px 16px -6px var(--a1);
    transition: transform .35s cubic-bezier(.22,1,.36,1);
  }
  .icon svg { width: 22px; height: 22px; display: block; }

  .name { font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; }
  .desc {
    margin: 12px 0 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--text-2);
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
  .tag {
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--text-2);
    background: color-mix(in srgb, var(--a1) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--a1) 22%, transparent);
  }
  @supports not (background: color-mix(in srgb, red 10%, transparent)) {
    .tag { background: var(--bg); border-color: var(--line); }
  }

  .go {
    position: absolute;
    top: 18px; right: 16px;
    color: var(--text-3);
    opacity: .45;
    transform: translateX(-3px);
    transition: opacity .25s, transform .25s;
  }
  .go svg { width: 17px; height: 17px; display: block; }

  /* 备用入口（同一项目有多个地址时） */
  .alt {
    margin-top: 11px;
    padding-top: 11px;
    border-top: 1px dashed var(--line);
    font-size: 12px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .alt a { color: var(--text-2); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .alt a:hover { color: var(--text); }

  /* ---------- 底部 ---------- */
  footer {
    margin-top: 42px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-3);
  }
  footer a { color: var(--text-3); text-decoration: none; }
  footer a:hover { color: var(--text-2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>xy6300.cc</div>
    <h1>我的网页</h1>
    <p class="sub">几个自己写的小东西，点开就能用。</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <span>© <span id="yr"></span> xy6300.cc</span>
    <span>托管于 GitHub Pages</span>
  </footer>
</div>

<script>
/* ============================================================
   要加一个新网页？照着往下面数组里加一项就行。
     name  标题
     desc  一句话说明
     href  主地址（可以是站内相对路径，如 "canvas/"）
     icon  图标名，目前有：canvas / music / image / note / chart / globe / code
     a1,a2 图标渐变的两个颜色
     tags  小标签（可省略）
     alt   备用入口：{ text: '备用地址', href: '...' }（可省略）
   ============================================================ */
const ICONS = {
  canvas: '<path d="M3 5.5A1.5 1.5 0 014.5 4h15A1.5 1.5 0 0121 5.5v13a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 18.5z"/><path d="M8 15.5l2.8-3.4 2.4 2.4 2-2.2L21 16"/>',
  music: '<circle cx="7" cy="18" r="2.6"/><circle cx="18.5" cy="15.5" r="2.6"/><path d="M9.6 18V6.4l11.5-2.6v11.7"/>',
  image: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17.5l4.6-4.4 3.4 3.2 2.8-2.6L20 17.6"/>',
  note: '<path d="M5 3.5h9.5L19 8v12.5H5z"/><path d="M14 3.5V8h5"/><path d="M8.5 12.5h7M8.5 16h4.5"/>',
  chart: '<path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/>',
  globe: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.3 3.6 8.5S14.4 18.1 12 20.5c-2.4-2.4-3.6-5.3-3.6-8.5S9.6 5.9 12 3.5z"/>',
  code: '<path d="M8.5 8L4.5 12l4 4M15.5 8l4 4-4 4"/>'
};

const SITES = [
  {
    name: '无边画布',
    desc: '无限画布：便签、图片、连线、思维导图、视图演示。手机上也能双指缩放。',
    href: 'canvas/',
    icon: 'canvas',
    a1: '#5b8cff', a2: '#8f6bff',
    tags: ['画布', '思维导图', '演示'],
    alt: {
      text: '备用地址',
      href: 'https://13192eab73474b56b21f1f637c7376e2.app.workbuddy.host'
    }
  },
  {
    name: '音乐教学演示台',
    desc: '课程单元管理，内容与图片存在阿里云 OSS 上，可随时增删。',
    href: 'music/',
    icon: 'music',
    a1: '#ff8a5b', a2: '#ff5b8c',
    tags: ['教学', 'OSS 存储']
  },
  {
    name: '音乐教学演示台 · 课堂版',
    desc: '面向课堂演示的另一版界面：进入课堂 / 教师管理入口。',
    href: 'https://piol911.github.io/art/',
    icon: 'music',
    a1: '#ffb340', a2: '#ff7a45',
    tags: ['教学']
  },
  {
    name: '我的小站',
    desc: '自我介绍页，带一个 B 站视频。',
    href: 'https://piol911.github.io/me/',
    icon: 'globe',
    a1: '#3fc6a0', a2: '#2f9fe0',
    tags: ['个人主页']
  },
  {
    name: '我的小站 · 简版',
    desc: '早期的极简版本，只有一段欢迎文字。',
    href: 'https://piol911.github.io/XY/',
    icon: 'note',
    a1: '#9a8cff', a2: '#c86bff',
    tags: ['个人主页']
  }
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.getElementById('grid').innerHTML = SITES.map((s, i) => {
  const alt = s.alt
    ? `<div class="alt">${esc(s.alt.text)}：<a href="${esc(s.alt.href)}" onclick="event.stopPropagation()">打开 ›</a></div>`
    : '';
  const tags = (s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  return `
  <a class="card" href="${esc(s.href)}" style="--a1:${s.a1};--a2:${s.a2};--d:${i * 60}ms">
    <span class="go" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17L17 7M9 7h8v8"/>
      </svg>
    </span>
    <div class="top">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          ${ICONS[s.icon] || ICONS.globe}
        </svg>
      </span>
      <span class="name">${esc(s.name)}</span>
    </div>
    <p class="desc">${esc(s.desc)}</p>
    ${tags ? `<div class="tags">${tags}</div>` : ''}
    ${alt}
  </a>`;
}).join('');

document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
